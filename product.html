<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - Yellow Day</title>
    <link rel="icon" type="image/jpeg" href="img/logo.jpeg">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/supabase.js"></script>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">
                <img src="img/logo.jpeg" alt="Yellow Day" class="logo-img">
                <div class="logo-text"><h1>Yellow Day</h1></div>
            </div>
            <div class="user-menu">
                <a href="index.html">الرئيسية</a>
                <a href="cart.html">🛒 <span id="cartCount">0</span></a>
            </div>
        </div>
    </header>

    <div class="page-container" style="max-width: 900px;">
        <div id="productDetail">
            <p style="text-align:center;padding:40px;">⏳ جاري التحميل...</p>
        </div>
        <a href="index.html" style="display: inline-block; margin-top: 20px; color: var(--primary-dark);">← العودة للمتجر</a>
    </div>

    <script src="js/supabase.js"></script>
    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            const allProducts = await supabase.getProducts();
            const product = allProducts.find(p => p.id === id);
            const detail = document.getElementById('productDetail');
            
            if (!product) {
                detail.innerHTML = '<p style="text-align:center;padding:40px;">❌ المنتج غير موجود</p>';
                return;
            }
            
            let stockInfoHTML = '';
            let buttonHTML = '';
            
            if (!product.inStock) {
                stockInfoHTML = '<div class="stock-info-box stock-info-out">❌ هذا المنتج غير متوفر حالياً - نفذت الكمية</div>';
                buttonHTML = '<button class="add-to-cart-btn" disabled style="width:100%;padding:15px;background:#ccc;color:#888;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:not-allowed;">غير متوفر حالياً</button>';
            } else if (product.stockQuantity <= 3) {
                stockInfoHTML = `<div class="stock-info-box stock-info-low">⚠️ كمية محدودة - متبقي ${product.stockQuantity} فقط</div>`;
                buttonHTML = `<button class="add-to-cart-btn" onclick="addToCartProduct(${product.id})" style="width:100%;padding:15px;background:#FFB800;color:#1A1A2E;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">أضف للسلة</button>`;
            } else {
                stockInfoHTML = `<div class="stock-info-box stock-info-available">✅ متوفر في المخزون (${product.stockQuantity})</div>`;
                buttonHTML = `<button class="add-to-cart-btn" onclick="addToCartProduct(${product.id})" style="width:100%;padding:15px;background:#FFB800;color:#1A1A2E;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;">أضف للسلة</button>`;
            }
            
            detail.innerHTML = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;">
                    <div style="background:${product.imageColor};min-height:350px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,0.2);padding:20px;text-align:center;position:relative;overflow:hidden;${!product.inStock ? 'opacity:0.5;' : ''}">
                        ${product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}" style="width:100%;height:100%;object-fit:contain;">` : product.name}
                        ${!product.inStock ? '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)rotate(-25deg);background:rgba(200,0,0,0.85);color:white;padding:10px 30px;font-size:20px;font-weight:800;border-radius:5px;">نفذت الكمية</div>' : ''}
                    </div>
                    <div>
                        <h2 style="font-size:28px;">${product.nameAr}</h2>
                        <p style="color:#888;">${product.name}</p>
                        <p style="font-size:30px;font-weight:800;color:#1A1A2E;margin:15px 0;">${product.price} <span style="font-size:16px;">دولار</span></p>
                        <p style="color:#888;">📂 ${product.category||'غير محدد'}${product.brand ? ' · 🏷️ ' + product.brand.nameAr : ''}</p>
                        ${stockInfoHTML}
                        <p style="line-height:1.8;margin:20px 0;font-size:15px;">${product.fullDesc||product.desc}</p>
                        ${buttonHTML}
                    </div>
                </div>`;
        }
        
        function addToCartProduct(id) {
            let cart = JSON.parse(localStorage.getItem('yellowDayCart')||'[]');
            const existing = cart.find(i=>i.productId===id);
            if(existing){existing.quantity+=1;}else{cart.push({productId:id,quantity:1});}
            localStorage.setItem('yellowDayCart',JSON.stringify(cart));
            updateCartCount();
            const btn = document.querySelector('.add-to-cart-btn');
            if(btn){btn.textContent='✓ تمت الإضافة';btn.style.background='#4CAF50';btn.style.color='white';
            setTimeout(()=>{btn.textContent='أضف للسلة';btn.style.background='#FFB800';btn.style.color='#1A1A2E';},1500);}
        }
        
        function updateCartCount(){
            const cart=JSON.parse(localStorage.getItem('yellowDayCart')||'[]');
            const count=cart.reduce((t,i)=>t+i.quantity,0);
            document.querySelectorAll('#cartCount').forEach(e=>{e.textContent=count;e.style.display=count>0?'flex':'none';});
        }
        
        document.addEventListener('DOMContentLoaded',function(){loadProduct();updateCartCount();});
    </script>
</body>
</html>
