<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Yellow Day</title>
    <link rel="icon" type="image/jpeg" href="img/logo.jpeg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">
                <img src="img/logo.jpeg" alt="Yellow Day" class="logo-img">
                <div class="logo-text"><h1>Yellow Day</h1></div>
            </div>
            <div class="user-menu">
                <a href="index.html">الرئيسية</a>
                <a href="cart.html">🛒 <span id="cartCount">0</span></a>
            </div>
        </div>
    </header>

    <div class="page-container">
        <h2>تسجيل الدخول</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="loginPhone" placeholder="09XXXXXXXX" required>
            </div>
            
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
            </div>
            
            <button type="submit" class="btn">دخول</button>
        </form>
        
        <p class="link-text">ليس لديك حساب؟ <a href="signup.html">إنشاء حساب</a></p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
